# SonarQube Cloud Automatic Analysis reads this file (not sonar-project.properties).
# These paths are generated build artifacts, not hand-written source:
#   - docs/api/website/index.html : Redoc output from `pnpm build:redocly`
#   - packages/sdk/src/orval/index.ts : orval-generated SDK from `pnpm build:sdk`
#   - apps/mobile/android/build.gradle : generated Android build metadata
# Android debug overlays are development-only and allow the local Metro server to
# use HTTP; analyze the main manifest instead of treating these partial overlays
# as release manifests (the main manifest defines backup rules and disables HTTP).
sonar.exclusions=docs/api/website/index.html, packages/sdk/src/orval/index.ts, apps/mobile/android/build.gradle, apps/mobile/android/app/src/debug/AndroidManifest.xml, apps/mobile/android/app/src/debugOptimized/AndroidManifest.xml
