# SonarQube Cloud Automatic Analysis reads this file (not sonar-project.properties).
# Both paths are generated build artifacts, not hand-written source:
#   - docs/api/website/index.html : Redoc output from `pnpm build:redocly`
#   - packages/sdk/src/orval/index.ts : orval-generated SDK from `pnpm build:sdk`
#   - apps/mobile/android/build.gradle : Capacitor boilerplate; classpath versions are
#     pinned inline (8.7.2 / 4.4.2); lockfile needs Android CI JDK to generate
sonar.exclusions=docs/api/website/index.html, packages/sdk/src/orval/index.ts, apps/mobile/android/build.gradle
