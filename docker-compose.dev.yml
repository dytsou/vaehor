services:
  postgres:
    image: postgres:16-alpine
    container_name: vaehor-postgres-dev
    restart: always
    # Host 5433 — 5432 is often another local Postgres (wrong password → slow Prisma auth)
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vaehor
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vaehor-redis-dev
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  vaehor-dev:
    image: node:26-alpine
    container_name: vaehor-dev
    working_dir: /app
    restart: always
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      # Mount the current directory to /app in the container
      - .:/app
      # Mount a volume for node_modules so it doesn't conflict with local machine
      - node_modules_vol:/app/node_modules
      - next_bundle_vol:/app/.next
    environment:
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/vaehor?schema=public
      - CI=true
    dns:
      - 8.8.8.8
      - 1.1.1.1
    command: >
      sh -c "
        apk add --no-cache libc6-compat openssl &&
        npm install -g pnpm &&
        pnpm install &&
        pnpm exec prisma generate &&
        pnpm exec prisma db push &&
        pnpm run dev:webpack
      "
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  postgres_data:
  node_modules_vol:
  next_bundle_vol:
