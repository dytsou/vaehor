name: Mobile Release

on:
  workflow_dispatch:
  push:
    tags:
      - "mobile-v*"

jobs:
  build-shell:
    name: Build mobile shell
    runs-on: ubuntu-latest
    outputs:
      has_ios_secrets: ${{ steps.secret-check.outputs.has_ios_secrets }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-project

      - name: Check iOS signing secrets
        id: secret-check
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
        run: |
          if [ -n "$IOS_CERTIFICATE_BASE64" ]; then
            echo "has_ios_secrets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_ios_secrets=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build shell and sync Android
        run: |
          pnpm --filter @vaehor/mobile run build
          cd apps/mobile && pnpm exec cap sync android

      - name: Mobile unit tests
        run: pnpm exec vitest run apps/mobile/__tests__

      - uses: actions/upload-artifact@v4
        with:
          name: mobile-android-tree
          path: apps/mobile/
          retention-days: 14

  android-release:
    name: Android release APK
    needs: build-shell
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v8
        with:
          name: mobile-android-tree
          path: apps/mobile

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Decode release keystore
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        working-directory: apps/mobile/android
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.keystore

      - name: Build release APK
        working-directory: apps/mobile/android
        env:
          ANDROID_KEYSTORE_FILE: release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ ! -f release.keystore ]; then
            unset ANDROID_KEYSTORE_FILE
          else
            export ANDROID_KEYSTORE_FILE="$PWD/release.keystore"
          fi
          chmod +x gradlew
          ./gradlew :app:assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: vaehor-android-apk
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: error

  ios-archive:
    name: iOS archive
    needs: build-shell
    runs-on: macos-latest
    if: ${{ needs.build-shell.outputs.has_ios_secrets == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-project

      - uses: actions/download-artifact@v8
        with:
          name: mobile-android-tree
          path: apps/mobile

      - name: Sync iOS platform
        run: pnpm --filter @vaehor/mobile run cap:sync:ios

      - name: Install CocoaPods
        run: pod install --project-directory=apps/mobile/ios/App

      - name: Import signing material
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "$IOS_CERTIFICATE_BASE64" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > $RUNNER_TEMP/profile.mobileprovision
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $RUNNER_TEMP/profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Archive iOS app
        working-directory: apps/mobile/ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -archivePath $RUNNER_TEMP/Vaehor.xcarchive archive CODE_SIGN_STYLE=Manual

      - uses: actions/upload-artifact@v4
        with:
          name: vaehor-ios-archive
          path: ${{ runner.temp }}/Vaehor.xcarchive
          retention-days: 30
