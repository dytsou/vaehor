name: CI
on:
  push:
    branches: [trunk, main, master]
  pull_request:
    branches: [trunk, main, master]

env:
  NODE_VERSION: "26"

permissions:
  contents: read

jobs:
  entrypoint-integration:
    name: Entrypoint Integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-project
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run entrypoint integration test
        run: pnpm test:integration:entrypoint
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres

  check:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-project
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit Tests
        run: pnpm test -- run

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(pnpm list @playwright/test --depth=0 | grep @playwright/test | awk '{print $2}')" >> $GITHUB_OUTPUT

      - name: Cache Playwright binary
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm run ci:playwright:browsers

      - name: Install Playwright system dependencies
        run: pnpm run ci:playwright:browser-deps

      - name: Run E2E Tests
        run: pnpm test:e2e --project=chromium
        env:
          CI: true
          SKIP_ENV_VALIDATION: "1"
          GOOGLE_CLIENT_ID: "mock_client_id"
          GOOGLE_CLIENT_SECRET: "mock_client_secret"
          NEXTAUTH_SECRET: "super_secret_mock_key_at_least_32_chars_long"
          NEXTAUTH_URL: "http://localhost:3000"
          KV_REST_API_URL: "https://mock.upstash.io"
          KV_REST_API_TOKEN: "mock_token"

      - name: Build
        run: pnpm build
        env:
          SKIP_ENV_VALIDATION: "1"
          GOOGLE_CLIENT_ID: "mock_client_id"
          GOOGLE_CLIENT_SECRET: "mock_client_secret"
          NEXTAUTH_SECRET: "super_secret_mock_key_at_least_32_chars_long"
          NEXTAUTH_URL: "http://localhost:3000"
          KV_REST_API_URL: "https://mock.upstash.io"
          KV_REST_API_TOKEN: "mock_token"
