name: Setup project
description: Install dependencies and prepare the workspace for CI jobs.

runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 11

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "24"
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Build MCP package
      shell: bash
      run: pnpm --filter @zee-index/mcp build

    - name: Generate Prisma Client
      shell: bash
      run: pnpm prisma generate
