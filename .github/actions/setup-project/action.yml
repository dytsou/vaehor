name: Setup project
description: Install dependencies and prepare the workspace for CI jobs.

inputs:
  node-version:
    description: Node.js version for setup-node
    required: false
    default: "26"

runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 11

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm run ci:deps

    - name: Build MCP package
      shell: bash
      run: pnpm --filter @vaehor/mcp build

    - name: Build SDK package
      shell: bash
      run: pnpm compile:sdk

    - name: Generate Prisma Client
      shell: bash
      run: pnpm prisma generate
