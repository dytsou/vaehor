# SonarQube / SonarCloud project configuration.
# Customize sonar.projectKey and sonar.organization to match your SonarQube instance.
sonar.projectKey=dytsou_drive-uploader
sonar.projectName=Drive Uploader
sonar.organization=dytsou

sonar.sourceEncoding=UTF-8

sonar.sources=app,components,hooks,lib,packages,proxy.ts
sonar.tests=__tests__
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx

sonar.exclusions=\
**/.next/**,\
**/node_modules/**,\
**/coverage/**,\
**/dist/**,\
**/playwright-report/**,\
**/test-results/**,\
**/*.test.ts,\
**/*.test.tsx,\
public/**,\
docs/api/website/**,\
prisma/migrations/**

sonar.coverage.exclusions=\
**/*.test.ts,\
**/*.test.tsx,\
e2e/**,\
lib/db.ts,\
lib/env.ts,\
lib/kv.ts,\
lib/store.ts,\
lib/logger.ts,\
lib/drive/index.ts

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPath=tsconfig.json
